name: deploy

# O pipeline faz o que você fez à mão na atividade 2. A cada push na main, ele
# derruba a topologia e sobe de novo, do zero.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # TODO: troque pelo seu slug, o começo do seu e-mail com ponto virando hífen.
  SLUG: iasmim-melo
  # TODO: a primeira porta da sua faixa. Veja em `gr-docker ajuda`.
  PORTA: 23110

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar a chave de deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: Derrubar a topologia antiga
        run: |
          # TODO: apague os três containers, se existirem.
          # Dica: o passo não pode falhar quando eles ainda não existem.
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm -f gr-${{ env.SLUG }}-front || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm -f gr-${{ env.SLUG }}-api || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm -f gr-${{ env.SLUG }}-banco || true

      - name: Criar rede e volume
        run: |
          # TODO: as duas redes e o volume. A rede do banco é interna.
          # Dica: criar o que já existe devolve erro. Trate isso.
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create web || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create --internal dados || true
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker volume create pgdata || true

      - name: Subir banco, API e front
        run: |
          # TODO: os três containers, na ordem certa.
          # O front precisa receber o commit que o deploy publicou:
          #   -e DEPLOY_SHA=${{ github.sha }}
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name banco --network dados -e POSTGRES_PASSWORD='${{ secrets.DB_SENHA }}' -e POSTGRES_DB=pokedex -v pgdata:/var/lib/postgresql/data postgres:17-alpine
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name api --network dados -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD='${{ secrets.DB_SENHA }}' gr-atv2-api:1
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network connect web api
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name front --network web -p ${{ env.PORTA }}:80 -e API=api -e DEPLOY_SHA=${{ github.sha }} gr-atv2-front:1
      
      - name: Conferir que subiu
        run: |
          # TODO: pergunte ao servidor se a listagem responde.
          ssh -i ~/.ssh/deploy gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker ps
